<text x="20" y="46" font-family="'Source Sans 3', Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#475569">Rewrites a serial O(T) recurrence into 64× shorter inter-chunk scan + parallel matmuls (C = 64).</text>
