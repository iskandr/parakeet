site_name: Parakeet
site_description: Runtime compiler for numerical Python - fused, parallel native code for CPUs and GPUs
site_url: https://rubinsteyn.com/parakeet/
repo_url: https://github.com/iskandr/parakeet
repo_name: iskandr/parakeet
edit_uri: edit/master/docs/
strict: true

theme:
  name: material
  font:
    text: Source Sans 3
    code: IBM Plex Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
  favicon: assets/favicon.svg

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting started: quickstart.md
  - Guide:
      - Using Parakeet:
          - The compiled language: language.md
          - Data-parallel operators: operators.md
          - Automatic differentiation: autodiff.md
          - Backends and GPUs: backends.md
          - Performance and tuning: performance.md
          - Errors and debugging: debugging.md
      - How Parakeet optimizes:
          - Operators & compilation walkthrough: primitives.md
          - Algebraic optimization: algebra.md
          - Rewrite rules & thesis lineage: rewrites.md
          - Compiler architecture: internals.md
          - Design, boundaries, and history: philosophy.md
  - Gallery:
      - Kernel gallery: gallery.md
      - Train nanoGPT: gallery/nanogpt.md
      - Bioinformatics & structural biology: bioinformatics.md
  - Benchmarks: release-benchmarks.md
  - Reference:
      - API: api.md
      - Supported functions: supported.md
      - Configuration: configuration.md
      - Migrating from 0.x: migrating.md
      - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - tables
  - toc: { permalink: true }
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets: { base_path: ["."] , check_paths: true }
  - pymdownx.tabbed: { alternate_style: true }

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
            show_source: false
            heading_level: 3
            docstring_style: google
            members_order: source
