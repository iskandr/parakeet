name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Install Metal bindings
        if: runner.os == 'macOS'
        run: python -m pip install -e ".[metal]"
      - name: Backends on this runner
        run: python -c "import parakeet, pprint; pprint.pprint(parakeet.available_backends())"
      - name: Test
        run: python -m pytest -n auto

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[docs]"
      - name: Supported-function list is up to date
        run: |
          python tools/gen_supported.py
          git diff --exit-code docs/supported.md
      - run: mkdocs build --strict
